    <text x="100" y="251" fill="rgba(255,255,255,0.8)">Standard Dental — 2026</text>
    <rect x="400" y="241" width="48" height="16" rx="8" fill="rgba(217,119,6,0.15)"/><text x="408" y="253" font-size="8" fill="#e8a33d">DENTAL</text>
    <text x="560" y="251" fill="rgba(255,255,255,0.45)">Family</text>
