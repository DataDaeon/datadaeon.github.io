    <rect x="400" y="203" width="56" height="16" rx="8" fill="rgba(59,91,219,0.15)"/><text x="410" y="215" font-size="8" fill="#8ea0f0">MEDICAL</text>
    <text x="560" y="213" fill="rgba(255,255,255,0.45)">Employee+</text>
    <text x="680" y="213" fill="rgba(255,255,255,0.45)">01/01/26</text>
  </g>
  <line x1="40" y1="228" x2="760" y2="228" stroke="rgba(255,255,255,0.05)"/>

