  <text x="680" y="32" font-family="Geist Mono, monospace" font-size="10" fill="#8ea0f0">+ Add plan</text>

  <text x="40" y="96" font-family="Geist Mono, monospace" font-size="18" font-weight="700" fill="#fff">Benefit plans</text>
  <rect x="40" y="114" width="300" height="30" rx="8" fill="#15151d" stroke="rgba(255,255,255,0.08)"/>
