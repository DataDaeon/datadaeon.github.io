  </g>
  <line x1="40" y1="266" x2="760" y2="266" stroke="rgba(255,255,255,0.05)"/>

  <g font-family="Geist Mono, monospace" font-size="11">
    <rect x="40" y="276" width="52" height="18" rx="4" fill="rgba(80,227,194,0.15)"/>
    <text x="48" y="289" font-size="8" fill="#50e3c2">ACTIVE</text>
    <text x="100" y="289" fill="rgba(255,255,255,0.8)">Vision Basic — 2026</text>
    <rect x="400" y="279" width="48" height="16" rx="8" fill="rgba(167,139,250,0.15)"/><text x="408" y="291" font-size="8" fill="#a78bfa">VISION</text>
    <text x="560" y="289" fill="rgba(255,255,255,0.45)">Employee+</text>
    <text x="680" y="289" fill="rgba(255,255,255,0.45)">07/01/26</text>
  </g>
  <line x1="40" y1="304" x2="760" y2="304" stroke="rgba(255,255,255,0.05)"/>

  <g font-family="Geist Mono, monospace" font-size="11">
    <rect x="40" y="314" width="46" height="18" rx="4" fill="rgba(255,255,255,0.08)"/>
    <text x="48" y="327" font-size="8" fill="rgba(255,255,255,0.5)">DRAFT</text>
    <text x="100" y="327" fill="rgba(255,255,255,0.8)">Core Medical — 2027 renewal</text>
    <rect x="400" y="317" width="56" height="16" rx="8" fill="rgba(59,91,219,0.15)"/><text x="410" y="329" font-size="8" fill="#8ea0f0">MEDICAL</text>
    <text x="560" y="327" fill="rgba(255,255,255,0.45)">Employee+</text>
    <text x="680" y="327" fill="rgba(255,255,255,0.45)">01/01/27</text>
  </g>

  <rect x="40" y="360" width="720" height="92" rx="10" fill="rgba(59,91,219,0.08)" stroke="rgba(59,91,219,0.2)"/>
  <text x="64" y="392" font-family="Geist Mono, monospace" font-size="12" fill="#fff">Plan configuration — eligible members, effective dates, plan rules</text>
  <text x="64" y="416" font-family="Geist Mono, monospace" font-size="10" fill="rgba(255,255,255,0.45)">Dense data, clear status states, same token system as the member portal</text>

  <text x="400" y="480" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="rgba(255,255,255,0.3)">Illustrative recreation — fictional product, generic plan names, generalized data</text>
