    <text x="400" y="178">LINE OF BUSINESS</text>
    <text x="560" y="178">ELIGIBLE</text>
    <text x="680" y="178">EFFECTIVE</text>
  </g>
  <line x1="40" y1="190" x2="760" y2="190" stroke="rgba(255,255,255,0.08)"/>

