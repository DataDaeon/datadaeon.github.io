<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Illustrative recreation — Harborview Benefits admin portal</title>
  <desc id="d">Generic recreation of an employer-benefits admin plan list screen — fictional product, generic plan names, no client branding.</desc>
  <rect width="800" height="500" fill="#0d0d14"/>
  <rect x="0" y="0" width="800" height="56" fill="#111118"/>
  <circle cx="40" cy="28" r="12" fill="#3B5BDB"/>
