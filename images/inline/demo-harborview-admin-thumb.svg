  <text x="372" y="134" font-family="Geist Mono, monospace" font-size="9" fill="rgba(255,255,255,0.45)">Filter</text>

  <g font-family="Geist Mono, monospace" font-size="9" fill="rgba(255,255,255,0.35)">
