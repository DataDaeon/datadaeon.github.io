<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Illustrative recreation — Connectify storefront</title>
  <desc id="d">Generic recreation of a telecom self-service storefront — fictional product, no client branding.</desc>
  <rect width="800" height="500" fill="#0d0d14"/>
  <rect x="0" y="0" width="800" height="60" fill="#111118"/>
  <path d="M40 40a26 26 0 0 1 32 0" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <path d="M46 32a17 17 0 0 1 20 0" fill="none" stroke="#50e3c2" stroke-width="3" stroke-linecap="round"/>
  <circle cx="56" cy="24" r="3.4" fill="#50e3c2"/>
