    <text x="308" y="402" fill="#50e3c2" font-size="15">$4,999</text>

    <rect x="536" y="270" width="225" height="170" rx="10" fill="#15151d" stroke="rgba(255,255,255,0.08)"/>
    <rect x="556" y="290" width="100" height="70" rx="6" fill="rgba(255,255,255,0.06)"/>
    <text x="556" y="382" fill="rgba(255,255,255,0.4)">Phone C</text>
