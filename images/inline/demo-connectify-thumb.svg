  <text x="135" y="220" text-anchor="middle" font-family="Geist Mono, monospace" font-size="11" fill="#050508">Renew now</text>

  <g font-family="Geist Mono, monospace" font-size="11" fill="rgba(255,255,255,0.55)">
    <rect x="40" y="270" width="225" height="170" rx="10" fill="#15151d" stroke="rgba(255,255,255,0.08)"/>
    <rect x="60" y="290" width="100" height="70" rx="6" fill="rgba(255,255,255,0.06)"/>
    <text x="60" y="382" fill="rgba(255,255,255,0.4)">Phone A</text>
    <text x="60" y="402" fill="#50e3c2" font-size="15">$7,989</text>

    <rect x="288" y="270" width="225" height="170" rx="10" fill="#15151d" stroke="rgba(255,255,255,0.08)"/>
