<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Illustrative recreation — GradeLine field app</title>
  <desc id="d">Generic recreation of a paving-contractor field platform — fictional product, no client branding.</desc>
  <rect width="800" height="500" fill="#0d0d14"/>
  <rect x="0" y="0" width="800" height="60" fill="#111118"/>
  <rect x="40" y="20" width="18" height="18" rx="4" fill="#0e2a47"/>
  <rect x="44" y="24" width="10" height="10" rx="2" fill="#0693e3"/>
  <text x="90" y="36" font-family="Geist Mono, monospace" font-size="15" fill="rgba(255,255,255,0.85)">GradeLine</text>

  <!-- map panel -->
  <rect x="40" y="96" width="440" height="320" rx="12" fill="#0a1420"/>
  <path d="M60 380 L140 300 L220 320 L300 220 L400 250 L460 150" fill="none" stroke="#1c4a7a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <path d="M60 380 L140 300 L220 320 L300 220 L400 250 L460 150" fill="none" stroke="#0693e3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="60" cy="380" r="7" fill="#0693e3"/>
  <circle cx="460" cy="150" r="7" fill="#0e2a47"/>
  <polygon points="230,300 300,280 320,340 250,360" fill="#8ed1fc" opacity="0.5"/>
  <polygon points="230,300 300,280 320,340 250,360" fill="none" stroke="#0e2a47" stroke-width="2"/>
  <!-- warning pin — amber reserved for warning only -->
  <circle cx="340" cy="230" r="10" fill="#f4a11e"/>
  <text x="340" y="234" text-anchor="middle" font-family="Geist Mono, monospace" font-size="12" font-weight="700" fill="#1a1a1a">!</text>
  <text x="60" y="128" font-family="Geist Mono, monospace" font-size="11" fill="rgba(255,255,255,0.4)">Route · Meridian Plaza lot</text>

  <!-- side rail: card stack -->
  <g font-family="Geist Mono, monospace" font-size="11">
    <rect x="500" y="96" width="260" height="94" rx="10" fill="#15151d" stroke="rgba(255,255,255,0.08)"/>
    <rect x="518" y="112" width="70" height="18" rx="9" fill="#0e2a47"/>
    <text x="553" y="125" text-anchor="middle" fill="#fff" font-size="9">Sales Rep</text>
    <text x="518" y="152" fill="rgba(255,255,255,0.7)" font-size="13">New Bid — 4 lines</text>
    <rect x="518" y="162" width="118" height="16" rx="4" fill="#0693e3"/>
    <text x="577" y="174" text-anchor="middle" fill="#fff" font-size="9">Send proposal</text>

    <rect x="500" y="204" width="260" height="94" rx="10" fill="#15151d" stroke="rgba(255,255,255,0.08)"/>
    <rect x="518" y="220" width="88" height="18" rx="9" fill="#0e2a47"/>
    <text x="562" y="233" text-anchor="middle" fill="#fff" font-size="9">Dispatcher</text>
    <text x="518" y="260" fill="rgba(255,255,255,0.7)" font-size="13">Crew 4 · 3 stops</text>
    <text x="518" y="278" fill="rgba(255,255,255,0.4)" font-size="10">why: closest open window</text>

    <rect x="500" y="312" width="260" height="94" rx="10" fill="#15151d" stroke="rgba(255,255,255,0.08)"/>
    <rect x="518" y="328" width="84" height="18" rx="9" fill="#0e2a47"/>
    <text x="560" y="341" text-anchor="middle" fill="#fff" font-size="9">Crew Lead</text>
    <rect x="518" y="350" width="100" height="34" rx="6" fill="#2e7d32"/>
    <text x="568" y="371" text-anchor="middle" fill="#fff" font-size="10">Start job</text>
  </g>

  <text x="400" y="475" text-anchor="middle" font-family="Geist Mono, monospace" font-size="10" fill="rgba(255,255,255,0.3)">Illustrative recreation — fictional product, generalized data</text>
</svg>
