<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t4 d4">
  <title id="t4">Illustrative recreation — GradeLine live AR lot measurement</title>
  <desc id="d4">Generic recreation of a live-AR site-capture screen that auto-measures lot surface area and crack length and flags standing water — fictional product, fictional data, no client branding.</desc>

  <defs>
    <linearGradient id="arbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="#0d0d14"/>
  <text x="400" y="30" text-anchor="middle" font-family="monospace" font-size="12" letter-spacing="1" fill="#50e3c2" opacity="0.7">GRADELINE · LIVE AR MEASURE · ILLUSTRATIVE</text>

  <g transform="translate(140,54)">
    <rect x="-8" y="-8" width="536" height="400" rx="20" fill="#1c1c26" stroke="#2c2c38" stroke-width="1.5"/>
    <rect x="0" y="0" width="520" height="384" rx="14" fill="url(#arbg)"/>
    <clipPath id="arclip"><rect x="0" y="0" width="520" height="384" rx="14"/></clipPath>
    <g clip-path="url(#arclip)">

      <!-- top controls -->
      <circle cx="26" cy="26" r="15" fill="#182235" stroke="#2a3a52"/>
      <path d="M20 20 L32 32 M32 20 L20 32" stroke="#c7ccd4" stroke-width="2" stroke-linecap="round"/>

      <rect x="56" y="12" width="60" height="28" rx="8" fill="#2a3a52" opacity="0.6"/>
      <text x="86" y="30" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#9fb3cf">Area</text>
      <rect x="120" y="12" width="78" height="28" rx="8" fill="#0693e3"/>
      <text x="159" y="30" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">Measure</text>
      <rect x="202" y="12" width="60" height="28" rx="8" fill="#182235" opacity="0.6"/>
      <text x="232" y="30" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#9fb3cf">Mark</text>
      <rect x="266" y="12" width="52" height="28" rx="8" fill="#182235" opacity="0.6"/>
      <text x="292" y="30" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#9fb3cf">Pin</text>

      <rect x="394" y="12" width="60" height="22" rx="7" fill="#182235"/>
      <text x="424" y="27" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#c7ccd4">0 photos</text>
      <rect x="460" y="12" width="52" height="22" rx="7" fill="#182235"/>
      <circle cx="470" cy="23" r="3" fill="#e05252"/>
      <text x="492" y="27" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#e0a0a0">live ar</text>

      <!-- detected parcel plane -->
      <polygon points="120,210 340,180 360,280 150,320" fill="#1c2b45" stroke="#6b8fc2" stroke-width="1.5" opacity="0.85"/>
      <line x1="150" y1="228" x2="332" y2="201" stroke="#9fb3cf" stroke-width="1" stroke-dasharray="4 3"/>
      <line x1="180" y1="245" x2="348" y2="219" stroke="#5b7aa8" stroke-width="1"/>
      <line x1="200" y1="270" x2="358" y2="245" stroke="#5b7aa8" stroke-width="1"/>
      <polygon points="280,250 340,242 346,272 288,280" fill="#f4a11e" opacity="0.3" stroke="#f4a11e" stroke-width="1.2" stroke-dasharray="3 2"/>
      <ellipse cx="190" cy="205" rx="26" ry="10" fill="#0693e3" opacity="0.25" stroke="#0693e3" stroke-dasharray="3 2"/>

      <!-- measurement chips -->
      <rect x="20" y="96" width="166" height="26" rx="8" fill="#0e2a47" stroke="#1d4876"/>
      <text x="32" y="113" font-family="sans-serif" font-size="10" fill="#bcdcff">Lot surface &#183; 27,400 sq ft</text>

      <rect x="20" y="130" width="166" height="26" rx="8" fill="#4a3a14" stroke="#7a5f1f"/>
      <text x="32" y="147" font-family="sans-serif" font-size="10" fill="#f3d79a">Crack network &#183; 340 lf</text>

      <rect x="20" y="164" width="190" height="26" rx="8" fill="#182235" stroke="#2a3a52"/>
      <text x="32" y="181" font-family="sans-serif" font-size="9" fill="#c7ccd4">Next photo &#183; main lot surface</text>

      <rect x="300" y="152" width="204" height="26" rx="8" fill="#4a1f24" stroke="#7a2e36"/>
      <text x="312" y="169" font-family="sans-serif" font-size="9" fill="#f3b3bb">Standing water detected</text>

      <text x="500" y="108" text-anchor="end" font-family="sans-serif" font-size="9" fill="#c7ccd4">photo</text>
      <rect x="470" y="118" width="48" height="48" rx="10" fill="#101827" stroke="#ffffff" stroke-width="2"/>
      <circle cx="494" cy="142" r="15" fill="#ffffff"/>
      <text x="500" y="186" text-anchor="end" font-family="sans-serif" font-size="9" fill="#c7ccd4">measure</text>

      <rect x="16" y="340" width="90" height="22" rx="7" fill="#182235"/>
      <text x="61" y="355" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#9fb3cf">sim &#183; demo data</text>
    </g>
  </g>

  <g opacity="0.55" font-family="monospace" font-size="12" fill="#9aa0ab">
    <rect x="30" y="60" width="150" height="40" rx="10" fill="#141420" stroke="#262634"/>
    <circle cx="52" cy="80" r="5" fill="#0693e3"/>
    <text x="68" y="84">Auto sq-ft</text>
    <rect x="620" y="400" width="150" height="40" rx="10" fill="#141420" stroke="#262634"/>
    <circle cx="642" cy="420" r="5" fill="#f4a11e"/>
    <text x="658" y="424">Issue flagged</text>
  </g>
</svg>
