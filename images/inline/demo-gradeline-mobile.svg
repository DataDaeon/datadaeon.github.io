<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2">
  <title id="t2">Illustrative recreation — GradeLine mobile sign-in, role picker</title>
  <desc id="d2">Generic recreation of a paving-contractor field app's mobile sign-in screen — fictional product name "GradeLine," fictional personas (Marisol, Devon, Hank), no client branding or real names.</desc>

  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#0693e3" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0693e3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c26"/>
      <stop offset="100%" stop-color="#101016"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="#0d0d14"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- floating UI chips either side, hinting at the wider app without competing with the phone -->
  <g opacity="0.55">
    <rect x="52" y="108" width="150" height="40" rx="10" fill="#141420" stroke="#262634"/>
    <circle cx="74" cy="128" r="5" fill="#0693e3"/>
    <text x="90" y="132" font-family="monospace" font-size="12" fill="#9aa0ab">Route · 3 stops</text>

    <rect x="40" y="168" width="130" height="40" rx="10" fill="#141420" stroke="#262634"/>
    <circle cx="62" cy="188" r="5" fill="#2e7d32"/>
    <text x="78" y="192" font-family="monospace" font-size="12" fill="#9aa0ab">Bid sent</text>

    <rect x="596" y="118" width="150" height="40" rx="10" fill="#141420" stroke="#262634"/>
    <circle cx="618" cy="138" r="5" fill="#f4a11e"/>
    <text x="634" y="142" font-family="monospace" font-size="12" fill="#9aa0ab">Weather flag</text>

    <rect x="610" y="178" width="140" height="40" rx="10" fill="#141420" stroke="#262634"/>
    <circle cx="632" cy="198" r="5" fill="#8ed1fc"/>
    <text x="648" y="202" font-family="monospace" font-size="12" fill="#9aa0ab">4 crews</text>
  </g>

  <!-- phone -->
  <g transform="translate(275,34)">
    <rect x="-6" y="-6" width="262" height="440" rx="34" fill="url(#bezel)" stroke="#2c2c38" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="428" rx="28" fill="#ffffff"/>
    <rect x="95" y="10" width="60" height="14" rx="7" fill="#101016"/>

    <!-- logo mark: original chevron/route glyph, not the real client's mark -->
    <circle cx="125" cy="66" r="20" fill="#eef6fd" stroke="#0693e3" stroke-width="1.5"/>
    <path d="M118 74 L125 54 L132 74 M121 68 L129 68" stroke="#0e2a47" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="125" y="100" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.5" fill="#0693e3">GRADELINE</text>
    <text x="125" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#101016">Field &amp; Bid App</text>
    <text x="125" y="130" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#8a8f98">Sign in as a role — screens follow</text>

    <!-- persona card: Marisol -->
    <g transform="translate(16,144)">
      <rect width="218" height="54" rx="10" fill="#ffffff" stroke="#e4e6ea"/>
      <circle cx="30" cy="27" r="16" fill="#0e2a47"/>
      <text x="30" y="31" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">M</text>
      <text x="56" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#101016">Marisol</text>
      <text x="56" y="34" font-family="sans-serif" font-size="8.5" fill="#0693e3">Sales Rep</text>
      <text x="56" y="44" font-family="sans-serif" font-size="7" fill="#9aa0ab">Field sales · starts on Bid</text>
    </g>

    <!-- persona card: Devon -->
    <g transform="translate(16,206)">
      <rect width="218" height="54" rx="10" fill="#ffffff" stroke="#e4e6ea"/>
      <circle cx="30" cy="27" r="16" fill="#0693e3"/>
      <text x="30" y="31" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">D</text>
      <text x="56" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#101016">Devon</text>
      <text x="56" y="34" font-family="sans-serif" font-size="8.5" fill="#0693e3">Dispatcher</text>
      <text x="56" y="44" font-family="sans-serif" font-size="7" fill="#9aa0ab">Ops desk · starts on Day Plan</text>
    </g>

    <!-- persona card: Hank -->
    <g transform="translate(16,268)">
      <rect width="218" height="54" rx="10" fill="#ffffff" stroke="#e4e6ea"/>
      <circle cx="30" cy="27" r="16" fill="#8ed1fc"/>
      <text x="30" y="31" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e2a47">H</text>
      <text x="56" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#101016">Hank</text>
      <text x="56" y="34" font-family="sans-serif" font-size="8.5" fill="#0693e3">Crew Lead</text>
      <text x="56" y="44" font-family="sans-serif" font-size="7" fill="#9aa0ab">Crew 4 · starts on Daily</text>
    </g>

    <rect x="56" y="372" width="138" height="28" rx="14" fill="#101016"/>
    <text x="125" y="390" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#ffffff">Back online · map ready</text>
    <text x="125" y="412" text-anchor="middle" font-family="sans-serif" font-size="6.5" fill="#b0b5bd">Demo accounts · illustrative recreation</text>
  </g>

  <text x="400" y="480" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="0.5" fill="#50e3c2" opacity="0.65">GRADELINE · MOBILE SIGN-IN · ILLUSTRATIVE</text>
</svg>
